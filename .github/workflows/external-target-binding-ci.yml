name: External Target Binding Qualification
on:
  push:
    branches: [ci/external-codeql-baseline-v1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  external-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout pinned MCP server
        uses: actions/checkout@v4
        with:
          repository: github/github-mcp-server
          ref: v2.1.0
          path: external/server
          persist-credentials: false
      - name: Checkout exact SDK dependency
        uses: actions/checkout@v4
        with:
          repository: google/go-github
          ref: v92.0.0
          path: external/sdk
          persist-credentials: false
      - name: Verify guard/write binding and generate disposable repair
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('external');out=pathlib.Path('audit-out');out.mkdir(exist_ok=True)
          server=(root/'server/pkg/github/repositories.go').read_text()
          sdk=(root/'sdk/github/repos_contents.go').read_text()
          mod=(root/'server/go.mod').read_text()
          def section(src,marker):
              pos=src.find(marker)
              assert pos>=0, marker+' absent'
              close=src.find('\n}',pos)
              assert close>pos, marker+' unterminated'
              return src[pos:close+2]
          handler=section(server,'func CreateOrUpdateFile(')
          get=section(sdk,'func (s *RepositoriesService) GetContents(')
          put=section(sdk,'func (s *RepositoriesService) CreateFile(')
          conditions={
            'sdk_pin':'github.com/google/go-github/v92 v92.0.0' in mod,
            'caller_sha':'sha := input.SHA' in handler,
            'sha_into_write':'opts.SHA = new(sha)' in handler,
            'caller_path':'path := input.Path' in handler,
            'guard_calls':handler.count('client.Repositories.GetContents(ctx, owner, repo, path, getOpts)')==2,
            'write_call':handler.count('client.Repositories.CreateFile(ctx, owner, repo, path, opts)')==1,
            'guard_url_encoded':'escapedPath := (&url.URL{Path: strings.TrimSuffix(path, "/")}).String()' in get and 'owner, repo, escapedPath)' in get,
            'write_url_raw':'owner, repo, path)' in put,
            'get_verb':'s.client.NewRequest(ctx, "GET", u, nil)' in get,
            'put_verb':'s.client.NewRequest(ctx, "PUT", u, body)' in put}
          assert all(conditions.values()),json.dumps(conditions)
          before='u := fmt.Sprintf("repos/%v/%v/contents/%v", owner, repo, path)'
          after='escapedPath := (&url.URL{Path: strings.TrimSuffix(path, "/")}).String()\n\tu := fmt.Sprintf("repos/%v/%v/contents/%v", owner, repo, escapedPath)'
          assert put.count(before)==1
          patched=put.replace(before,after,1)
          replacement=sdk.replace(put,patched,1)
          (out/'repos_contents_repaired.go').write_text(replacement)
          digest=lambda s:hashlib.sha256(s.encode()).hexdigest()
          evidence={'schema':'risu.pinned-source-ci/v0.3','status':'PASS','conditions':conditions,
            'server_source_sha256':digest(server),'sdk_source_sha256':digest(sdk),
            'patched_sdk_sha256':digest(replacement)}
          (out/'audit.json').write_text(json.dumps(evidence,indent=2)+'\n')
          print('PINNED_EXTERNAL_SOURCE_AUDIT_PASS',json.dumps(conditions,sort_keys=True))
          PY
      - name: Install real SDK route regression test
        shell: bash
        run: |
          cat > external/sdk/github/risu_target_binding_test.go <<'GO'
          package github
          import ("context"; "encoding/json"; "fmt"; "net/http"; "os"; "strings"; "testing")
          func TestRISUSDKGuardWritePath(t *testing.T) {
            vectors:=[]struct{path string;bad bool}{
              {"docs/a.txt",false},{"docs/C#/intro.md",true},{"notes/what?.md",true},
              {"docs/%23literal.md",true},{"docs/[draft].md",false},
            }
            fixed:=os.Getenv("RISU_EXPECT_FIXED")=="1"
            for _,tt:=range vectors {
              t.Run(strings.ReplaceAll(tt.path,"/","_"),func(t *testing.T){
                client,mux,_:=setup(t)
                readPath,writePath:="",""
                mux.HandleFunc("/repos/owner/repo/contents/",func(w http.ResponseWriter,r *http.Request){
                  target:=strings.TrimPrefix(r.URL.Path,"/repos/owner/repo/contents/")
                  switch r.Method{
                  case http.MethodGet:
                    readPath=target
                    fmt.Fprint(w,`{"sha":"approved","type":"file","name":"example"}`)
                  case http.MethodPut:
                    writePath=target
                    var p struct{SHA string `json:"sha"`}
                    if err:=json.NewDecoder(r.Body).Decode(&p);err!=nil{t.Errorf("PUT body %v",err)}
                    if p.SHA!="approved"{t.Errorf("caller SHA lost: %q",p.SHA)}
                    fmt.Fprint(w,`{"content":{"sha":"updated"},"commit":{"sha":"commit"}}`)
                  default:t.Errorf("unexpected %s",r.Method)
                  }
                })
                ctx:=context.Background()
                if _,_,_,err:=client.Repositories.GetContents(ctx,"owner","repo",tt.path,nil);err!=nil{t.Fatal(err)}
                opts:=&RepositoryContentFileOptions{Message:Ptr("update"),Content:[]byte("updated"),SHA:Ptr("approved")}
                if _,_,err:=client.Repositories.CreateFile(ctx,"owner","repo",tt.path,opts);err!=nil{t.Fatal(err)}
                mismatch:=readPath!=writePath
                t.Logf("RISU_SDK_WIRE fixed=%v input=%q get=%q put=%q mismatch=%v",fixed,tt.path,readPath,writePath,mismatch)
                if fixed&&mismatch{t.Fatal("patched SDK mismatch")}
                if !fixed&&mismatch!=tt.bad{t.Fatal("baseline mismatch classification wrong")}
                if fixed&&(readPath!=tt.path||writePath!=tt.path){t.Fatal("patched identity lost")}
              })
            }
          }
          GO
      - name: Run unpatched actual SDK route controls
        shell: bash
        run: |
          cd external/sdk
          RISU_EXPECT_FIXED=0 go test ./github -run 'TestRISUSDKGuardWritePath' -count=1 -timeout=6m -v | tee ../../audit-out/sdk-unpatched-wire.log
      - name: Syntax-check repaired full SDK
        run: |
          gofmt -e audit-out/repos_contents_repaired.go > /dev/null
          echo PATCHED_FULL_SDK_SYNTAX_PASS
      - name: Run actual go-github SDK tests on disposable repair
        shell: bash
        run: |
          cp audit-out/repos_contents_repaired.go external/sdk/github/repos_contents.go
          cd external/sdk
          go test ./github -run 'TestRepositoriesService_(GetContents|CreateFile)' -count=1 -timeout=6m -v | tee ../../audit-out/sdk-unit-tests.log
      - name: Run patched actual SDK route controls
        shell: bash
        run: |
          cd external/sdk
          RISU_EXPECT_FIXED=1 go test ./github -run 'TestRISUSDKGuardWritePath' -count=1 -timeout=6m -v | tee ../../audit-out/sdk-patched-wire.log
      - name: Retain read-only audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-binding-audit
          path: audit-out/
          if-no-files-found: warn
