name: RISU P6-B9 mcp-go raw schema independent holdout
on:
  push:
    branches: ['qualification/p6b9-*']
    paths:
      - 'benchmarks/p6b9/go1139_capture_test.go'
      - 'benchmarks/p6b9/evaluate_go1139.py'
      - '.github/workflows/p6b9-go1139-holdout.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pinned-upstream-go-source:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prelocked source, no credential or user data
        run: |
          set -euo pipefail
          python tools/public_ci_audit.py
          test "$(git hash-object src/risu_mcp_trace.py)" = b709cc61e37657ff18f90b15113aa500334e6762
          python -m venv .b9-go-env
          .b9-go-env/bin/python -m pip install --disable-pip-version-check .
          mkdir -p .p6b9-go
      - name: Original Go MCP handler and schema validator before/fix
        run: |
          set -euo pipefail
          for REV in old fixed; do
            if [[ "$REV" == old ]]; then
              SHA=c0e5b67f97375fa284ec854d92cb2df49c2ef959
              BLOB=7b0ca11251c103201322f14d242d0d91c554cfe0
            else
              SHA=8995d9b137ef36511e6f03a79f6ff0e5ba4d7574
              BLOB=8ceebe211eed03f1ffd9d68a1f75f5defb991468
            fi
            UP=".b9-go-$REV"
            mkdir -p "$UP"
            git -C "$UP" init -q
            git -C "$UP" -c core.hooksPath=/dev/null remote add origin https://github.com/mark3labs/mcp-go.git
            GIT_TERMINAL_PROMPT=0 GIT_LFS_SKIP_SMUDGE=1 git -C "$UP" -c core.hooksPath=/dev/null fetch -q --no-tags --depth=1 origin "$SHA"
            git -C "$UP" -c core.hooksPath=/dev/null checkout -q --detach FETCH_HEAD
            test "$(git -C "$UP" rev-parse HEAD)" = "$SHA"
            test "$(git -C "$UP" rev-parse HEAD:server/output_validation.go)" = "$BLOB"
            cp benchmarks/p6b9/go1139_capture_test.go "$UP/server/risu_b9_capture_test.go"
            RISU_B9_GO_CAPTURE_PATH="$GITHUB_WORKSPACE/.p6b9-go/$REV.json" \
              go -C "$UP" test ./server -count=1 -run '^TestRisuB9RawStructuredOutput$' -v
            .b9-go-env/bin/python benchmarks/p6b9/evaluate_go1139.py trace ".p6b9-go/$REV.json" ".p6b9-go/$REV.jsonl"
            .b9-go-env/bin/risu-probe verify-mcp-trace ".p6b9-go/$REV.jsonl" --protocol-version 2025-11-25 --format json > ".p6b9-go/$REV-risu.json"
            rm -rf "$UP"
          done
      - name: Independent upstream truth and unchanged RISU engine result
        run: |
          set -euo pipefail
          .b9-go-env/bin/python benchmarks/p6b9/evaluate_go1139.py score \
            .p6b9-go/old.json .p6b9-go/fixed.json \
            .p6b9-go/old-risu.json .p6b9-go/fixed-risu.json \
            .p6b9-go/independent_score.json
          echo P6B9_GO1139_SCORE_RECORDED
      - name: Preserve real public SDK results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: risu-p6b9-go1139-public-independent
          retention-days: 21
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            benchmarks/p6b9/prelocked_seven_families.json
            .p6b9-go/*.json
            .p6b9-go/*.jsonl
