name: RISU P6-B15 independent source-first three-publisher audit
on:
  push:
    branches: ['qualification/p6b15-*']
    paths:
      - 'benchmarks/p6b15/audit_three_unseen_originals.py'
      - '.github/workflows/p6b15-unseen-cross-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit-originals-with-negative-tamper-control:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preserve original PA firstpass evidence
        uses: actions/download-artifact@v4
        with:
          repository: risu-research/risu-probe
          run-id: 43290126061
          github-token: ${{ github.token }}
          name: risu-b15-original-external-PA
          path: .b15-heldout/PA
      - name: Preserve original ZM firstpass evidence
        uses: actions/download-artifact@v4
        with:
          repository: risu-research/risu-probe
          run-id: 43290126061
          github-token: ${{ github.token }}
          name: risu-b15-original-external-ZM
          path: .b15-heldout/ZM
      - name: Preserve original FM firstpass evidence
        uses: actions/download-artifact@v4
        with:
          repository: risu-research/risu-probe
          run-id: 43290126061
          github-token: ${{ github.token }}
          name: risu-b15-original-external-FM
          path: .b15-heldout/FM
      - name: Check frozen product hash and exact first-pass raw original source transcripts
        run: |
          set -euo pipefail
          python tools/public_ci_audit.py
          test "$(git hash-object src/risu_mcp_observations.py)" = 4314e9bf92e2ec75c421bab25eae3b43f1424a08
          test "$(git hash-object src/risu_mcp_trace.py)" = 9f017ca0344d94cf54bd0229ddb14d4f586101c8
          python benchmarks/p6b15/audit_three_unseen_originals.py             --pa .b15-heldout/PA --zm .b15-heldout/ZM --fm .b15-heldout/FM             --out .b15-heldout/B15_FROZEN_CROSS_AUDIT.json
          python - <<'PY'
          import json
          x=json.load(open('.b15-heldout/B15_FROZEN_CROSS_AUDIT.json'))['report']
          assert x['locked_calls_verified']==14
          assert x['frozen_product_declared_contract_mismatches']==1
          assert x['declared_contract_conflicts_with_contemporaneous_tool_description']==1
          assert x['independently_adjudicated_upstream_behavior_bugs']==0
          assert x['defensible_obligations_checked']==13
          print('B15_ORIGINAL_14_CALLS_AND_CONTRACT_VALIDITY_AUDIT_PASS')
          PY
      - name: Negative control tampered bytes must fail even with valid looking report
        run: |
          set -euo pipefail
          cp -r .b15-heldout/PA .b15-heldout/PA_TAMPER
          printf ' ' >> .b15-heldout/PA_TAMPER/.b15-original/original_stdio.jsonl
          if python benchmarks/p6b15/audit_three_unseen_originals.py             --pa .b15-heldout/PA_TAMPER --zm .b15-heldout/ZM --fm .b15-heldout/FM             --out .b15-heldout/MUST_NOT_EXIST.json; then
            echo 'Tampered source incorrectly accepted' >&2
            exit 3
          fi
          test ! -e .b15-heldout/MUST_NOT_EXIST.json
          echo B15_UNSEEN_EVIDENCE_TAMPER_CONTROL_REJECTED_AS_REQUIRED
      - name: Preserve independent ledger and its source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: risu-b15-frozen-independent-three-publisher-audit
          retention-days: 21
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            benchmarks/p6b15/FROZEN_DETECTOR_BEFORE_HOLDOUT.json
            benchmarks/p6b15/FROZEN_UNSEEN_ORIGINAL_SERVERS.json
            benchmarks/p6b15/audit_three_unseen_originals.py
            .b15-heldout/B15_FROZEN_CROSS_AUDIT.json
