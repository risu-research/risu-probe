name: RISU P6-B15 full installed-wheel regression (source frozen)
on:
  push:
    branches: ['qualification/p6b15-*']
    paths:
      - 'src/risu_mcp_observations.py'
      - 'src/risu_p5d_cli.py'
      - 'pyproject.toml'
      - 'tests/test_p6b15_observation_contract.py'
      - '.github/workflows/p6b15-full-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  all-existing-tests:
    name: Frozen B15 installed full suite ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preserve B15 preregistered product identity and source purity
        run: |
          set -euo pipefail
          python tools/public_ci_audit.py
          test "$(git hash-object src/risu_mcp_observations.py)" = 4314e9bf92e2ec75c421bab25eae3b43f1424a08
          test "$(git hash-object src/risu_mcp_trace.py)" = 9f017ca0344d94cf54bd0229ddb14d4f586101c8
      - name: Independently build and install actual preview wheel, run all tests
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'setuptools>=68,<82' 'wheel>=0.44,<1'
          mkdir -p .b15-wheel-output
          python -m pip wheel --no-deps -w .b15-wheel-output .
          python -m venv .b15-verification
          if [[ "${{ runner.os }}" == Windows ]]; then
            PY=.b15-verification/Scripts/python.exe
          else
            PY=.b15-verification/bin/python
          fi
          "$PY" -m pip install .b15-wheel-output/risu_probe_preview-*.whl
          "$PY" -m pip check
          "$PY" -m risu_p5d_cli check-mcp-observations --help
          "$PY" -m unittest discover -s tests -v
          echo B15_FROZEN_PRODUCT_ALL_PRIOR_AND_NEW_REGRESSIONS_PASS
