name: RISU P6-B11 native particulars Go server original stdio heldout
on:
  push:
    branches: ['qualification/p6b11-*']
    paths:
      - 'benchmarks/p6b11/capture_native_stdio.py'
      - 'benchmarks/p6b11/score_raw_stdio.py'
      - 'benchmarks/p6b11/particulars_mirror_contract.json'
      - '.github/workflows/p6b11-particulars15-native-stdio.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pinned-native-original-mcp-stdio:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.7'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Freeze analyzer and install public offline checker
        run: |
          set -euo pipefail
          python tools/public_ci_audit.py
          test "$(git hash-object src/risu_mcp_trace.py)" = 9f017ca0344d94cf54bd0229ddb14d4f586101c8
          test "$(git hash-object src/risu_display_fidelity.py)" = 6785b2ed912d3e9a41dda956da537dc2e5f4f8e3
          go version
          python -m venv .b11-p-env
          .b11-p-env/bin/python -m pip install --disable-pip-version-check .
          .b11-p-env/bin/python -m pip check
          mkdir -p .b11-native-particulars
      - name: Build and execute genuine original particulars CLI MCP server at pinned revisions
        run: |
          set -euo pipefail
          for REV in old fixed; do
            if [[ "$REV" == old ]]; then
              SHA=d5707f3cd8320e9ef0519b40cee814aa3610e80d
              BLOB=ef9e0d475e2616252c34abcdfdb7cc6778bdd22d
            else
              SHA=c13850f57c03ae8bd9f2092f7be8ac7d749e3fc6
              BLOB=56e4882da42fc4c4026e700c22348d940678e72d
            fi
            UP=".b11-particulars-source-$REV"
            mkdir -p "$UP"
            git -C "$UP" init -q
            git -C "$UP" -c core.hooksPath=/dev/null remote add origin https://github.com/nodelogicau/particulars-cli.git
            GIT_TERMINAL_PROMPT=0 GIT_LFS_SKIP_SMUDGE=1 git -C "$UP" -c core.hooksPath=/dev/null fetch -q --no-tags --depth=1 origin "$SHA"
            git -C "$UP" -c core.hooksPath=/dev/null checkout -q --detach FETCH_HEAD
            test "$(git -C "$UP" rev-parse HEAD)" = "$SHA"
            test "$(git -C "$UP" rev-parse HEAD:internal/mcp/server.go)" = "$BLOB"
            BIN="$GITHUB_WORKSPACE/.b11-native-particulars/$REV-binary"
            (cd "$UP" && GOTOOLCHAIN=auto go build -o "$BIN" ./cmd/particulars)
            WS="$GITHUB_WORKSPACE/.b11-native-particulars/$REV-workspace"
            "$BIN" init "$WS" --author "RISU Public Synthetic" --harness "b11-audit" \
              --base-uri https://example.invalid/b11/synthetic/
            .b11-p-env/bin/python benchmarks/p6b11/capture_native_stdio.py \
              --family PARTICULARS15 --revision "$REV" \
              --binary ".b11-native-particulars/$REV-binary" \
              --server-arg=serve --server-arg=--mcp --server-arg=--workspace --server-arg="$WS" \
              --out ".b11-native-particulars/$REV"
            .b11-p-env/bin/risu-probe verify-mcp-trace ".b11-native-particulars/$REV/original_stdio.jsonl" \
              --display-contract benchmarks/p6b11/particulars_mirror_contract.json \
              --protocol-version 2025-11-25 --format json > ".b11-native-particulars/$REV-risu.json"
            rm -rf "$UP"
          done
      - name: Original server source and frozen checker evidence score
        run: |
          set -euo pipefail
          .b11-p-env/bin/python benchmarks/p6b11/score_raw_stdio.py PARTICULARS15 \
            .b11-native-particulars/old .b11-native-particulars/fixed \
            .b11-native-particulars/old-risu.json .b11-native-particulars/fixed-risu.json \
            .b11-native-particulars/source_score.json
          echo B11_NATIVE_PARTICULARS_RAW_STDIO_VERIFIED
      - name: Preserve original native server's stdout response bytes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: risu-b11-particulars15-native-stdio
          retention-days: 21
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            benchmarks/p6b11/prelocked_three_organizations.json
            .b11-native-particulars/*/original_stdio.jsonl
            .b11-native-particulars/*/origin.json
            .b11-native-particulars/*-risu.json
            .b11-native-particulars/source_score.json
