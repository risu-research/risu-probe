name: B53 official MCP SDK transport qualification
on:
  push:
    branches: [qualification/p6b53-official-sdk-transport-20261127]
    paths: ['benchmarks/p6b53/**', '.github/workflows/p6b53-official-sdk.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore exact frozen source and pinned evaluator
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p b53-work b53-evidence
          base64 -d benchmarks/p6b53/frozen_b52_src.b64 > b53-work/frozen.zip
          echo '976870182cd87d286788328360e0ed874957bcefc7e2ea153166565c35d332e9  b53-work/frozen.zip' | sha256sum -c -
          python -m zipfile -e b53-work/frozen.zip b53-work
          base64 -d benchmarks/p6b53/sdk_probe.b64 > b53-work/sdk_probe.py
          echo 'afcee0cb29dc3ffa6ac333966eea59acc08a4aa5fbce5fce049d0c1bf9344b96  b53-work/sdk_probe.py' | sha256sum -c -
          git --version
      - name: Acquire and verify official PyPI wheel
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip download --only-binary=:all: --no-deps --dest b53-work mcp==2.3.0
          echo 'dd0c44c089d16453e8ae31a3877a0054d7a2314caaa81f5e0541b9b1734b2377  b53-work/mcp-2.3.0-py3-none-any.whl' | sha256sum -c - | tee b53-evidence/sdk-wheel-verify.txt
          python -m pip install b53-work/mcp-2.3.0-py3-none-any.whl cryptography
          python -m pip freeze > b53-evidence/dependencies.txt
      - name: Real SDK client and server with native Git effect
        shell: bash
        run: |
          set -o pipefail
          python b53-work/sdk_probe.py exercise b53-evidence/run 2>&1 | tee b53-evidence/RUN.txt
      - name: Preserve public-only evidence
        if: always()
        shell: bash
        run: |
          rm -rf b53-evidence/run/ephemeral b53-evidence/run/effect.git
          mkdir -p b53-evidence
          git rev-parse HEAD > b53-evidence/research-commit.txt
          find b53-evidence -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > b53-evidence/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b53-official-sdk-evidence
          path: b53-evidence/
          retention-days: 90
