name: RISU B32 sealed two untouched publishers original signed subject holdout
on:
  push:
    branches: [qualification/p6b32-original-delegated-signature-closure-20261113]
    paths:
      - benchmarks/p6b32/SEALED_NEVER_SEEN_PUBLISHER_HOLDOUT_H5_H6.md
      - .github/workflows/p6b32-sealed-h5-h6-original-evaluation.yml
  workflow_dispatch:
permissions:
  contents: read
  attestations: read
jobs:
  original-new-publisher-signed-subjects:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download release bytes pinned before sealed first look, do not execute
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .b32-holdout .b32-untouched-results
          curl -fLSs --retry 4 --retry-all-errors --max-time 180 \
            https://github.com/klodr/gmail-mcp/releases/download/v3.0.0/index.js \
            -o .b32-holdout/index.js
          curl -fLSs --retry 4 --retry-all-errors --max-time 180 \
            https://github.com/libredb/libredb-studio/releases/download/1.3.0/libredb-studio-1.3.0.cdx.json \
            -o .b32-holdout/libredb-studio-1.3.0.cdx.json
          echo '682301b9d0aaf51fbdbd05a1abea28387f1f4d06bfb9a0490a47e6421960cc4e  .b32-holdout/index.js' | sha256sum -c -
          echo '7baef425849d7e54252bdf7bddb552f8fb27de39f0069e88c3af7efbcd4e87e8  .b32-holdout/libredb-studio-1.3.0.cdx.json' | sha256sum -c -
      - name: Evaluate native gh baseline and frozen B32 without modifying the policy
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check .
          if gh attestation verify .b32-holdout/index.js --repo klodr/gmail-mcp --format json \
               >.b32-untouched-results/H5_original_gh_verified.json \
               2>.b32-untouched-results/H5_gh_stderr.txt; then
            echo 0 >.b32-untouched-results/H5_original_gh_status.txt
          else
            echo "$?" >.b32-untouched-results/H5_original_gh_status.txt
          fi
          if risu-probe verify-delegated-signed-provenance \
            --asset .b32-holdout/index.js \
            --source-repo klodr/gmail-mcp \
            --signer-identity 'https://github.com/klodr/gmail-mcp/.github/workflows/release.yml@refs/tags/v3.0.0' \
            --source-ref refs/tags/v3.0.0 \
            --sha256 682301b9d0aaf51fbdbd05a1abea28387f1f4d06bfb9a0490a47e6421960cc4e \
            --out .b32-untouched-results/H5_frozen_policy_verdict.json \
            2>.b32-untouched-results/H5_policy_stderr.txt; then
            echo 0 >.b32-untouched-results/H5_policy_status.txt
          else
            echo "$?" >.b32-untouched-results/H5_policy_status.txt
          fi
          if gh attestation verify .b32-holdout/libredb-studio-1.3.0.cdx.json \
               --repo libredb/libredb-studio --format json \
               >.b32-untouched-results/H6_original_gh_verified.json \
               2>.b32-untouched-results/H6_gh_stderr.txt; then
            echo 0 >.b32-untouched-results/H6_original_gh_status.txt
          else
            echo "$?" >.b32-untouched-results/H6_original_gh_status.txt
          fi
          if risu-probe verify-delegated-signed-provenance \
            --asset .b32-holdout/libredb-studio-1.3.0.cdx.json \
            --source-repo libredb/libredb-studio \
            --signer-identity 'https://github.com/libredb/libredb-studio/.github/workflows/release-artifacts.yml@refs/tags/1.3.0' \
            --source-ref refs/tags/1.3.0 \
            --sha256 7baef425849d7e54252bdf7bddb552f8fb27de39f0069e88c3af7efbcd4e87e8 \
            --out .b32-untouched-results/H6_frozen_policy_verdict.json \
            2>.b32-untouched-results/H6_policy_stderr.txt; then
            echo 0 >.b32-untouched-results/H6_policy_status.txt
          else
            echo "$?" >.b32-untouched-results/H6_policy_status.txt
          fi
      - name: Preserve exact native outcomes and original signed names, including legitimate refusals
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path(".b32-untouched-results")
          summary={"schema":"risu-b32-sealed-two-new-publishers-native-vs-frozen-policy-v1",
             "evaluation_source_code_sha":"a3ab9b0faaa377a2d2ce3fba4e4ee7d2c92caea0",
             "original_holdout_publishers":[],
             "not_a_security_vulnerability_claim":True}
          for id,name in (("H5","klodr/gmail-mcp"),("H6","libredb/libredb-studio")):
              native=int((p/(id+"_original_gh_status.txt")).read_text().strip())
              policy=int((p/(id+"_policy_status.txt")).read_text().strip())
              record={"id":id,"repository":name,
                 "native_signature_verified":native==0,
                 "frozen_b32_policy_accepted":policy==0,
                 "native_exit":native,"b32_exit":policy,
                 "signed_subject_names":[]}
              if native==0:
                  q=json.loads((p/(id+"_original_gh_verified.json")).read_text())
                  for row in q:
                      v=row["verificationResult"]
                      st=v["statement"]
                      record["signed_subject_names"] += [s["name"] for s in st["subject"]]
                      record["signer"]=v["signature"]["certificate"].get("subjectAlternativeName")
                      record["source"]=v["signature"]["certificate"].get("sourceRepositoryURI")
                      record["source_ref"]=v["signature"]["certificate"].get("sourceRepositoryRef")
                  record["signed_subject_names"]=record["signed_subject_names"][:50]
              if policy==0:
                  v=json.loads((p/(id+"_frozen_policy_verdict.json")).read_text())
                  assert v["claim_states"]["separate_resource_owner_approval"]=="UNVERIFIED"
                  assert v["grants_authority_over_unrelated_resource"] is False
              print("B32_SEALED_HELDOUT",json.dumps(record,sort_keys=True))
              summary["original_holdout_publishers"].append(record)
          (p/"H5_H6_sealed_observation_summary.json").write_text(json.dumps(summary,sort_keys=True,indent=2)+"\n")
          assert len(summary["original_holdout_publishers"])==2
          print("B32_SEALED_TWO_NEW_ORIGINAL_PUBLISHERS_ALL_RESULTS_PRESERVED")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: risu-b32-h5-h6-sealed-original-native-and-frozen-risu-evaluation
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
          path: .b32-untouched-results/
