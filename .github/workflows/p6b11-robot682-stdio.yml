name: RISU P6-B11 ROBOT682 actual MCP SDK stdio cross-vendor heldout
on:
  push:
    branches: ['qualification/p6b11-*']
    paths:
      - 'benchmarks/p6b11/robot682_real_sdk_stdio.py'
      - 'benchmarks/p6b11/capture_native_stdio.py'
      - 'benchmarks/p6b11/score_raw_stdio.py'
      - 'benchmarks/p6b11/robot_markdown_contract.json'
      - '.github/workflows/p6b11-robot682-stdio.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-upstream-source-real-stdio:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Freeze B11 engine; install isolated genuine MCP SDK and upstream dependencies
        run: |
          set -euo pipefail
          python tools/public_ci_audit.py
          test "$(git hash-object src/risu_mcp_trace.py)" = 9f017ca0344d94cf54bd0229ddb14d4f586101c8
          test "$(git hash-object src/risu_display_fidelity.py)" = 6785b2ed912d3e9a41dda956da537dc2e5f4f8e3
          python -m venv .b11-robot-env
          .b11-robot-env/bin/python -m pip install --disable-pip-version-check . 'mcp==1.29.0' 'robotframework>=7,<9' 'robotcode-core==2.8.0'
          .b11-robot-env/bin/python -m pip check
          mkdir -p .b11-robot-stdio
      - name: Run official pinned source formatter old and fixed over real MCP SDK stdio
        run: |
          set -euo pipefail
          for REV in old fixed; do
            if [[ "$REV" == old ]]; then
              SHA=2ed4d2f00c1afb4069744fb607e0243d3b07ab9b
              BLOB=d5b229f8058cd7312c9afcef1327591f71ce0f94
            else
              SHA=a1a9073c0e3defd1aaabd0f88d7bc91be404e884
              BLOB=34bb39c3c3ade9798cf0ee145b915720e6dcce8e
            fi
            UP=".b11-robot-source-$REV"
            mkdir -p "$UP"
            git -C "$UP" init -q
            git -C "$UP" -c core.hooksPath=/dev/null remote add origin https://github.com/robotcodedev/robotcode.git
            # Historic SHA 43aaa4 could not be fetched shallow. The immediately
            # preceding official-fix parent has IDENTICAL formatter and imported
            # markdown_docs source blobs; recovery is explicitly recorded.
            FETCH=a1a9073c0e3defd1aaabd0f88d7bc91be404e884
            DEPTH=2
            if [[ "$REV" == fixed ]]; then DEPTH=1; fi
            GIT_TERMINAL_PROMPT=0 GIT_LFS_SKIP_SMUDGE=1 git -C "$UP" -c core.hooksPath=/dev/null fetch -q --no-tags --depth="$DEPTH" origin "$FETCH"
            git -C "$UP" -c core.hooksPath=/dev/null checkout -q --detach "$SHA"
            test "$(git -C "$UP" rev-parse HEAD)" = "$SHA"
            test "$(git -C "$UP" rev-parse HEAD:packages/robot/src/robotcode/robot/utils/markdownformatter.py)" = "$BLOB"
            if [[ "$REV" == old ]]; then
              test "$(git -C "$UP" rev-parse HEAD:packages/robot/src/robotcode/robot/utils/markdown_docs.py)" = 6c206efd252c86a6ae946b9a2420e0afaee08831
            fi
            # Fail with a bounded diagnostic BEFORE launching stdio if
            # upstream source cannot be imported in this exact environment.
            PYTHONPATH="$UP/packages/robot/src" .b11-robot-env/bin/python - <<'PY'
          from robotcode.robot.utils.markdownformatter import MarkDownFormatter
          assert MarkDownFormatter().format("``ordinary``").strip()
          print('ROBOT_SOURCE_IMPORT_AND_BASELINE_FORMATTER_PASSED')
          PY
            .b11-robot-env/bin/python benchmarks/p6b11/capture_native_stdio.py \
              --family ROBOT682 --revision "$REV" \
              --binary .b11-robot-env/bin/python \
              --server-arg="$GITHUB_WORKSPACE/benchmarks/p6b11/robot682_real_sdk_stdio.py" \
              --pythonpath "$UP/packages/robot/src" \
              --out ".b11-robot-stdio/$REV"
            .b11-robot-env/bin/risu-probe verify-mcp-trace ".b11-robot-stdio/$REV/original_stdio.jsonl" \
              --display-contract benchmarks/p6b11/robot_markdown_contract.json \
              --protocol-version 2025-11-25 --format json > ".b11-robot-stdio/$REV-risu.json"
            rm -rf "$UP"
          done
      - name: Independently adjudicate actual upstream code span before/after fix
        run: |
          set -euo pipefail
          .b11-robot-env/bin/python benchmarks/p6b11/score_raw_stdio.py ROBOT682 \
            .b11-robot-stdio/old .b11-robot-stdio/fixed \
            .b11-robot-stdio/old-risu.json .b11-robot-stdio/fixed-risu.json \
            .b11-robot-stdio/source_score.json
          echo B11_ROBOT682_REAL_STDIO_QUALIFIED
      - name: Preserve true SDK stdio stdout bytes and source score
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: risu-b11-robot682-real-sdk-stdio
          retention-days: 21
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            benchmarks/p6b11/prelocked_three_organizations.json
            benchmarks/p6b11/robot682_execution_recovery.json
            .b11-robot-stdio/*/original_stdio.jsonl
            .b11-robot-stdio/*/origin.json
            .b11-robot-stdio/*-risu.json
            .b11-robot-stdio/source_score.json
