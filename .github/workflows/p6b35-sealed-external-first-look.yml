name: "B35 sealed: frozen new algorithm vs nine independent real upstream fixes"
on:
  push:
    branches:
      - qualification/p6b35-sealed-independent-holdout-20261113
    paths:
      - benchmarks/p6b35/**
      - .github/workflows/p6b35-sealed-external-first-look.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  first-look-original-sources:
    name: Original merged before-after Git blobs, frozen public and pre-held-out algorithm
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout B35 evaluator and untouched sealed manifest
        uses: actions/checkout@v5
        with:
          path: holdout
          persist-credentials: false
      - name: Checkout exact B34-derived algorithm frozen BEFORE B35 first look
        uses: actions/checkout@v5
        with:
          repository: risu-research/risu-probe
          ref: c34def4a25b66cbc89df039ca235d6c1df2094f0
          path: development
          persist-credentials: false
      - name: Checkout frozen public RISU Probe baseline
        uses: actions/checkout@v5
        with:
          repository: risu-research/risu-probe
          ref: 8d622b792b4ae58b7157fd81ee5f95d6febcfd53
          path: frozen
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Checkout D1 external original before
        uses: actions/checkout@v5
        with:
          repository: confident-ai/deepeval
          ref: 954752bae1ebef291984ea42cf87da79b8e820fa
          path: holdout/upstream/D1/before
          persist-credentials: false
          submodules: false
          fetch-depth: 1
          sparse-checkout: |
            deepeval/metrics/mcp/utils.py
          sparse-checkout-cone-mode: false
      - name: Checkout D1 external original after
        uses: actions/checkout@v5
        with:
          repository: confident-ai/deepeval
          ref: 6cb657de320a7b68a901e29455b3a9224a215077
          path: holdout/upstream/D1/after
          persist-credentials: false
          submodules: false
