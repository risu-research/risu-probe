            src/mcp_proxies/modern_rest.rs
          sparse-checkout-cone-mode: false
      - name: Checkout D9 external original after
        uses: actions/checkout@v5
        with:
          repository: affinidi-ai/agent-gateway
          ref: 3c31dae4c6c51fba5d1aa5a76e3cf78c5a8dd803
          path: holdout/upstream/D9/after
          persist-credentials: false
          submodules: false
          fetch-depth: 1
          sparse-checkout: |
            src/mcp_proxies/handlers.rs
            src/mcp_proxies/modern_rest.rs
          sparse-checkout-cone-mode: false
      - name: Install exact frozen public baseline in a clean virtual environment
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C frozen rev-parse HEAD)" = 8d622b792b4ae58b7157fd81ee5f95d6febcfd53
          test "$(git -C development rev-parse HEAD)" = c34def4a25b66cbc89df039ca235d6c1df2094f0
          python -m venv .b35-python
          .b35-python/bin/python -m pip install --disable-pip-version-check ./frozen
          .b35-python/bin/risu-probe doctor --format json
      - name: Run FIRST B35 evaluation without changing rules or executing original upstream code
        shell: bash
        run: |
          set -euo pipefail
          .b35-python/bin/python holdout/benchmarks/p6b35/run_sealed_once.py .b35-python/bin/risu-probe
          sha256sum holdout/out/B35_FIRST_LOOK_RESULTS.json
          cat holdout/out/B35_FIRST_LOOK_REPORT.md
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: risu-p6b35-nine-original-external-fixes-first-look
          retention-days: 90
          if-no-files-found: error
          path: |
            holdout/out/B35_FIRST_LOOK_RESULTS.json
            holdout/out/B35_FIRST_LOOK_REPORT.md
