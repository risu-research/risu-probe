name: P6-B41 original native client evidence and unchanged B38 status contracts
on:
  push:
    branches: [qualification/p6b41-sealed-original-client-fpr-20261114]
    paths:
      - .github/workflows/p6b41-original-native-runtime.yml
      - benchmarks/p6b41/runners/**
  workflow_dispatch:
permissions:
  contents: read

jobs:
  n1-mark3labs-original-client:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - uses: actions/checkout@v5
        with: {repository: mark3labs/mcp-go, ref: a21ffc6877f1741603dc36246f309d6cf6c6ed05, path: original, persist-credentials: false}
      - uses: actions/checkout@v5
        with:
          repository: risu-research/risu-probe
          ref: 425d3d8272c4e725064010ed8fbf5b8217080cab
          path: frozen-b38
          persist-credentials: false
          sparse-checkout: |
            research/b38_native_contract_auditor.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-go@v6
        with: {go-version-file: original/go.mod}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Freeze original client and auditor before any run
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C original rev-parse HEAD)" = a21ffc6877f1741603dc36246f309d6cf6c6ed05
          test "$(git -C original rev-parse HEAD:client/client.go)" = 9f1a4a692507e1c4854cf03f5fb9064351ad6da8
          test "$(git -C original rev-parse HEAD:client/inprocess.go)" = b7071a07e7ceb6201c859a80b7d600c6ed816521
          test "$(git -C frozen-b38 rev-parse HEAD:research/b38_native_contract_auditor.py)" = 67bbb607d277dda3a1ead60a2ccd9ba807afd7ae
          mkdir -p out
      - name: Overlay only independent B41 native test in original external source tree
        run: cp benchmarks/p6b41/runners/mark3labs_native_original_test.go original/client/b41_native_original_test.go
      - name: Execute original client over original actual native JSONRPC transport
        shell: bash
        run: |
          set -euo pipefail
          export B41_N1_WITNESS="$PWD/out/B41_N1_ORIGINAL_NATIVE.json"
          (cd original && go test ./client -run '^TestB41OriginalExternalGoClientNativeWire$' -count=1 -v) 2>&1 | tee out/B41_N1_ORIGINAL_NATIVE.log
          test -s out/B41_N1_ORIGINAL_NATIVE.json
      - name: Frozen B38 status contract independently scores original client behavior
        shell: bash
        run: |
          set -euo pipefail
          python benchmarks/p6b41/runners/score_b41.py --mode n1 \
            --checker frozen-b38/research/b38_native_contract_auditor.py \
            --input out/B41_N1_ORIGINAL_NATIVE.json \
            --output out/B41_N1_B38_SCORE.json
          sha256sum out/B41_N1_*.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: b41-n1-mark3labs-original-native, path: out/B41_N1_*, if-no-files-found: warn, retention-days: 90}

  n2-metoro-original-client:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - uses: actions/checkout@v5
        with: {repository: metoro-io/mcp-golang, ref: e5d629c5cd43e3470dcd3bf4cbc675a90bfcf513, path: original, persist-credentials: false}
      - uses: actions/checkout@v5
        with:
          repository: risu-research/risu-probe
          ref: 425d3d8272c4e725064010ed8fbf5b8217080cab
          path: frozen-b38
          persist-credentials: false
          sparse-checkout: |
            research/b38_native_contract_auditor.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-go@v6
        with: {go-version: '1.25'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Verify original source hash and fixed checker
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C original rev-parse HEAD)" = e5d629c5cd43e3470dcd3bf4cbc675a90bfcf513
          test "$(git -C original rev-parse HEAD:client.go)" = a0e3536b9cd2a3081b65fa2c97e2b5f6eede86ac
          test "$(git -C frozen-b38 rev-parse HEAD:research/b38_native_contract_auditor.py)" = 67bbb607d277dda3a1ead60a2ccd9ba807afd7ae
          mkdir -p out
      - name: Copy test-only witness; original Metoro client remains original
        run: cp benchmarks/p6b41/runners/metoro_native_original_test.go original/b41_native_original_test.go
      - name: Execute original HTTP MCP client with native JSONRPC success and tool error
        shell: bash
        run: |
          set -euo pipefail
          export B41_N2_WITNESS="$PWD/out/B41_N2_ORIGINAL_NATIVE.json"
          (cd original && go test . -run '^TestB41OriginalMetoroMCPClientNativeWire$' -count=1 -v) 2>&1 | tee out/B41_N2_ORIGINAL_NATIVE.log
          test -s out/B41_N2_ORIGINAL_NATIVE.json
      - name: Strict scorer does not assign a success/error score to unsupported original API status
        shell: bash
        run: |
          set -euo pipefail
          python benchmarks/p6b41/runners/score_b41.py --mode n2 \
            --checker frozen-b38/research/b38_native_contract_auditor.py \
            --input out/B41_N2_ORIGINAL_NATIVE.json \
            --output out/B41_N2_B38_ELIGIBILITY.json
          sha256sum out/B41_N2_*.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: b41-n2-metoro-original-native, path: out/B41_N2_*, if-no-files-found: warn, retention-days: 90}

  p1-agentmetry-original-relay:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - uses: actions/checkout@v5
        with: {repository: blitzcrieg1/agentmetry, ref: 773a5bc6e35f467b21967aff17e5737f2a1f8bc5, path: original/before, persist-credentials: false}
      - uses: actions/checkout@v5
        with: {repository: blitzcrieg1/agentmetry, ref: ad2de9e44b37738879b7efb2ab862583b53ddd9e, path: original/after, persist-credentials: false}
      - uses: actions/checkout@v5
        with:
          repository: risu-research/risu-probe
          ref: 425d3d8272c4e725064010ed8fbf5b8217080cab
          path: frozen-b38
          persist-credentials: false
          sparse-checkout: |
            research/b38_native_contract_auditor.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Validate original before and after Git blobs and frozen B38 source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C original/before rev-parse HEAD:apps/orchestrator/agentmetry/hooks/mcp_proxy.py)" = 5654e78bb930a3aa25ac86573cbdecd53d918ea4
          test "$(git -C original/after rev-parse HEAD:apps/orchestrator/agentmetry/hooks/mcp_proxy.py)" = f6ce68be377a43891947653e670944474b9e5822
          test "$(git -C frozen-b38 rev-parse HEAD:research/b38_native_contract_auditor.py)" = 67bbb607d277dda3a1ead60a2ccd9ba807afd7ae
          mkdir -p out
      - name: Dependencies of independently authored parser, no network after install
        shell: bash
        run: python -m pip install 'pytest>=8' 'pytest-asyncio>=0.24' 'pydantic>=2.9' 'pydantic-settings>=2.6' 'httpx>=0.28' 'pyyaml>=6'
      - name: Original earlier proxy really observes native JSONRPC over its own relay
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD/original/before/apps/orchestrator" python benchmarks/p6b41/runners/agentmetry_original_relay.py \
            --variant before --output out/B41_P1_NATIVE_BEFORE.json 2>&1 | tee out/B41_P1_NATIVE_BEFORE.log
      - name: Official repaired proxy observes same original response over own relay
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="$PWD/original/after/apps/orchestrator" python benchmarks/p6b41/runners/agentmetry_original_relay.py \
            --variant after --output out/B41_P1_NATIVE_AFTER.json 2>&1 | tee out/B41_P1_NATIVE_AFTER.log
      - name: Source-independent frozen B38 audit never treats missing terminal status as observed success
        shell: bash
        run: |
          set -euo pipefail
          python benchmarks/p6b41/runners/score_b41.py --mode p1 \
            --checker frozen-b38/research/b38_native_contract_auditor.py \
            --input out/B41_P1_NATIVE_BEFORE.json out/B41_P1_NATIVE_AFTER.json \
            --output out/B41_P1_B38_SCORE.json
          sha256sum out/B41_P1_*.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: b41-p1-agentmetry-original-native-relay, path: out/B41_P1_*, if-no-files-found: warn, retention-days: 90}
