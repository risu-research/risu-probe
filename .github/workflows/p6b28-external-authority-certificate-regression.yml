name: RISU B28 installed cross-platform issuer-authority evidence verifier
on:
  push:
    branches:
      - qualification/p6b28-external-issuer-live-revocation-20261113
    paths:
      - src/risu_mcp_external_authority_certificate.py
      - src/risu_p5d_cli.py
      - pyproject.toml
      - tests/test_p6b28_external_authority_certificate.py
      - .github/workflows/p6b28-external-authority-certificate-regression.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  exact-original-record-certificate:
    name: Installed RISU external-authority checker + negative controls, 3 operating systems
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: risu-b28-openbao-original-issuer-postgresql-real-resource
          repository: risu-research/risu-probe
          run-id: 43377450878
          github-token: ${{ github.token }}
          path: .b28-original-record
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install wheel with B28 product verifier and prior dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'setuptools>=68,<82' 'wheel>=0.44,<1'
          mkdir -p .b28-wheel
          python -m pip wheel --no-deps -w .b28-wheel .
          python -m venv .b28-installed
          if [[ "${{ runner.os }}" == Windows ]]; then
            PY=.b28-installed/Scripts/python.exe
            CLI=.b28-installed/Scripts/risu-probe.exe
          else
            PY=.b28-installed/bin/python
            CLI=.b28-installed/bin/risu-probe
          fi
          "$PY" -m pip install .b28-wheel/risu_probe_preview-*.whl
          "$PY" -m pip install --disable-pip-version-check 'cryptography>=43,<49'
          "$PY" -m pip check
          "$PY" -m risu_mcp_external_authority_certificate --help
          echo B28_INSTALLED_CROSS_PLATFORM_WHEEL_VERIFIER_READY
      - name: Verify exact original GitHub artifact and fail closed against evidence tampering
        env:
          RISU_B28_EXTERNAL_EVIDENCE_DIR: .b28-original-record
        run: |
          set -euo pipefail
          if [[ "${{ runner.os }}" == Windows ]]; then
            PY=.b28-installed/Scripts/python.exe
            CLI=.b28-installed/Scripts/risu-probe.exe
          else
            PY=.b28-installed/bin/python
            CLI=.b28-installed/bin/risu-probe
          fi
          "$PY" -m unittest discover -s tests -p test_p6b28_external_authority_certificate.py -v
          "$CLI" verify-mcp-external-authority \
            --evidence-dir .b28-original-record \
            --out .b28-record-certificate.json
          "$PY" - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path(".b28-record-certificate.json").read_text())
          m={v["claim"]:v["supported_by_recorded_evidence"] for v in x["claims"]}
          assert x["status"]=="RECORDED_ORIGINAL_NATIVE_EVIDENCE_CONSISTENT"
          assert x["actual_native_denied_resource_cases"]==14
          assert m["one_use_wrapped_credential_delivery"] is True
          assert m["native_credential_revocation_enforced_at_new_login"] is True
          assert m["independent_real_human_resource_owner"] is False
          assert m["wrapping_token_cryptographically_binds_recipient"] is False
          print("B28_NATIVE_ISSUER_EFFECT_CERTIFICATE_AUDITABLE_NOT_HUMAN_OWNER_PASS")
          PY
      - name: All existing RISU source tests against actual installed wheel
        env:
          RISU_B28_EXTERNAL_EVIDENCE_DIR: .b28-original-record
        run: |
          set -euo pipefail
          if [[ "${{ runner.os }}" == Windows ]]; then
            PY=.b28-installed/Scripts/python.exe
            CLI=.b28-installed/Scripts/risu-probe.exe
          else
            PY=.b28-installed/bin/python
            CLI=.b28-installed/bin/risu-probe
          fi
          RISU_P6A_TEST_CLI="$CLI" "$PY" -m unittest discover -s tests -v
          echo B28_ALL_EXISTING_RISU_REGRESSION_TESTS_PASS
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: risu-b28-installed-portable-authority-certificate-${{ matrix.os }}
          if-no-files-found: error
          retention-days: 30
          path: .b28-record-certificate.json
