name: RISU P6-B19 frozen signed-release comparator full regression
on:
  push:
    branches: ['qualification/p6b19-*']
    paths:
      - 'src/risu_mcp_signed_repair.py'
      - 'src/risu_p5d_cli.py'
      - 'pyproject.toml'
      - 'tests/test_p6b19_signed_publisher_repair.py'
      - '.github/workflows/p6b19-full-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  entire-wheel:
    name: B19 all previous RISU + signed-upstream repair ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preserve prior B15-B18 source and check public-safe project policy
        run: |
          set -euo pipefail
          python tools/public_ci_audit.py
          test "$(git hash-object src/risu_mcp_runtime_origin.py)" = eba052165106bd85cb935ed505544ea33819054b
          test "$(git hash-object src/risu_mcp_origin.py)" = 75180de2dbd78165d2e970ee15e99df14804e7f1
          test "$(git hash-object src/risu_mcp_authority.py)" = be24472b0fea8d8e7a252a7a36158cf8873128de
      - name: Build installed preview wheel and run whole regression
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'setuptools>=68,<82' 'wheel>=0.44,<1'
          mkdir -p .b19-wheels
          python -m pip wheel --no-deps -w .b19-wheels .
          python -m venv .b19-test-venv
          if [[ "${{ runner.os }}" == Windows ]]; then
            PY=.b19-test-venv/Scripts/python.exe
            CLI=.b19-test-venv/Scripts/risu-probe.exe
          else
            PY=.b19-test-venv/bin/python
            CLI=.b19-test-venv/bin/risu-probe
          fi
          "$PY" -m pip install .b19-wheels/risu_probe_preview-*.whl
          "$PY" -m pip check
          "$PY" -m risu_p5d_cli compare-signed-mcp-repair --help
          RISU_P6A_TEST_CLI="$CLI" "$PY" -m unittest discover -s tests -v
          echo B19_COMPLETE_LEGACY_AND_PUBLISHER_REPAIR_TESTS_PASS
