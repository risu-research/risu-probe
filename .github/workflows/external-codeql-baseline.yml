name: External Code Analysis Baseline
on:
  push:
    branches: [ci/external-codeql-baseline-v1]
  workflow_dispatch:
permissions:
  contents: read
  security-events: read
jobs:
  codeql-go-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout frozen public upstream fixture
        uses: actions/checkout@v4
        with:
          repository: github/github-mcp-server
          ref: v2.1.0
          persist-credentials: false
      - name: Prepare a domain-aware CodeQL review query
        shell: bash
        run: |
          mkdir -p .codeql/guard-binding
          cat > .codeql/guard-binding/qlpack.yml <<'YML'
          name: research/go-guard-binding-review
          version: 0.0.1
          dependencies:
            codeql/go-all: '*'
          YML
          cat > .codeql/guard-binding/GuardWriteReview.ql <<'QL'
          /**
           * @name Preflight and write paths require resource-binding review
           * @description Finds paths passed to separate metadata and write APIs. Flags review candidates, not confirmed defects.
           * @kind problem
           * @id research/guard-write-path-review
           * @problem.severity warning
           * @precision medium
           */
          import go

          from CallExpr readCall, CallExpr writeCall
          where
            readCall.getCalleeName() = "GetContents" and
            writeCall.getCalleeName() = "CreateFile" and
            readCall.getEnclosingFunction() = writeCall.getEnclosingFunction() and
            readCall.getArgument(3).toString() = writeCall.getArgument(3).toString()
          select writeCall,
            "Metadata preflight and write share a source path but separate API implementations; verify effective resource identity."
          QL
      - name: Initialize standard CodeQL baseline
        uses: github/codeql-action/init@v4
        with:
          languages: go
          build-mode: autobuild
          queries: security-extended,./.codeql/guard-binding/GuardWriteReview.ql
      - name: Run static analysis without publishing alerts
        uses: github/codeql-action/analyze@v4
        with:
          upload: false
          output: codeql-results
      - name: Count baseline findings
        shell: bash
        run: |
          python3 - <<'PY'
          import json,glob
          for f in glob.glob('codeql-results/**/*.sarif',recursive=True):
              j=json.load(open(f))
              print('SARIF:', f)
              for run in j.get('runs',[]):
                  results=run.get('results',[])
                  print('all_alerts=',len(results))
                  print('file_update_related_alerts=',sum('repos_contents.go' in json.dumps(t) or 'repositories.go' in json.dumps(t) for t in results))
                  print('ruleids=',sorted({r.get('ruleId','') for r in results})[:100])
          PY
      - name: Upload reviewable baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-codeql-standard-baseline
          path: codeql-results
          if-no-files-found: warn
