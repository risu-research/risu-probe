name: "P6-B37 frozen first-look eight independent original MCP fixes"
on:
  push:
    branches:
      - qualification/p6b37-sealed-external-20261113
    paths:
      - benchmarks/p6b37/**
      - .github/workflows/p6b37-immutable-first-look.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  first-independent-evidence:
    name: Original Git trees, pre-frozen B37 algorithm, public product; read only
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout sealed B37 cases and read-only evaluator
        uses: actions/checkout@v5
        with:
          path: holdout
          persist-credentials: false
      - name: Checkout exact algorithm fixed after prior-B36 only development
        uses: actions/checkout@v5
        with:
          repository: risu-research/risu-probe
          ref: fd025a31a18d5d1c57f089af19ab8342b25f6cd4
          path: development
          persist-credentials: false
      - name: Checkout public baseline frozen before B34
        uses: actions/checkout@v5
        with:
          repository: risu-research/risu-probe
          ref: 8d622b792b4ae58b7157fd81ee5f95d6febcfd53
          path: frozen
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verify original B37A before immutable upstream commit
        uses: actions/checkout@v5
        with:
          repository: Eigenwise/atomic-agents
          ref: 151dadb64814378e82fb7e87ac9c6125c37ae431
          path: holdout/upstream/B37A/before
          persist-credentials: false
          submodules: false
          fetch-depth: 1
          sparse-checkout: |
            atomic-agents/atomic_agents/connectors/mcp/mcp_factory.py
          sparse-checkout-cone-mode: false
      - name: Verify original B37A after immutable upstream commit
