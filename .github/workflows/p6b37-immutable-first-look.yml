      - name: Verify original B37H after immutable upstream commit
        uses: actions/checkout@v5
        with:
          repository: portofcontext/pctx
          ref: 275f0dadfc215fa780cae7cd7c178b65f6d06dfd
          path: holdout/upstream/B37H/after
          persist-credentials: false
          submodules: false
          fetch-depth: 1
          sparse-checkout: |
            crates/pctx_registry/src/registry.rs
          sparse-checkout-cone-mode: false
      - name: Install untouched public CLI and assert original main SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C frozen rev-parse HEAD)" = 8d622b792b4ae58b7157fd81ee5f95d6febcfd53
          test "$(git -C development rev-parse HEAD)" = fd025a31a18d5d1c57f089af19ab8342b25f6cd4
          python -m venv .b37-python
          .b37-python/bin/python -m pip install --disable-pip-version-check ./frozen
          .b37-python/bin/risu-probe doctor --format json
      - name: Execute one-time B37 frozen source holdout with no foreign source execution
        shell: bash
        run: |
          set -euo pipefail
          .b37-python/bin/python holdout/benchmarks/p6b37/run_first_look.py .b37-python/bin/risu-probe
          sha256sum holdout/out/B37_FIRST_LOOK_RESULTS.json
          cat holdout/out/B37_FIRST_LOOK_REPORT.md
      - name: Preserve exact derived report and outputs, excluding original foreign source bytes
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: risu-p6b37-eight-independent-git-originals-first-look
