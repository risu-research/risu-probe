      - name: Checkout B36H genuine after fix-side Git parent
        uses: actions/checkout@v5
        with:
          repository: codeready-toolchain/tarsy
          ref: e623b8e56bbfb253e30bdffb488a071c586a2176
          path: holdout/upstream/B36H/after
          persist-credentials: false
          submodules: false
          fetch-depth: 1
          sparse-checkout: |
            pkg/mcp/executor.go
          sparse-checkout-cone-mode: false
      - name: Install exact frozen public product with isolated interpreter
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C frozen rev-parse HEAD)" = 8d622b792b4ae58b7157fd81ee5f95d6febcfd53
          test "$(git -C development rev-parse HEAD)" = c34def4a25b66cbc89df039ca235d6c1df2094f0
          python -m venv .b36-python
          .b36-python/bin/python -m pip install --disable-pip-version-check ./frozen
          .b36-python/bin/risu-probe doctor --format json
      - name: Run first frozen B36 source audit without changing rule code or executing upstream
        shell: bash
        run: |
          set -euo pipefail
          .b36-python/bin/python holdout/benchmarks/p6b36/run_sealed_once.py .b36-python/bin/risu-probe
          sha256sum holdout/out/B36_FIRST_LOOK_RESULTS.json
          cat holdout/out/B36_FIRST_LOOK_REPORT.md
      - name: Supplementary original Git tree SHA correction, with original seal preserved
        shell: bash
        run: |
          set -euo pipefail
          .b36-python/bin/python holdout/benchmarks/p6b36/run_provenance_erratum.py .b36-python/bin/risu-probe
          sha256sum holdout/out/B36_SUPPLEMENTAL_RESULTS.json
          cat holdout/out/B36_SUPPLEMENTAL_REPORT.md
      - name: Preserve original result and transparent corrected supplement
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: risu-b36-eight-original-merged-fixes-first-look
          retention-days: 90
          if-no-files-found: error
          path: |
            holdout/out/B36_FIRST_LOOK_RESULTS.json
            holdout/out/B36_FIRST_LOOK_REPORT.md
            holdout/out/B36_SUPPLEMENTAL_RESULTS.json
            holdout/out/B36_SUPPLEMENTAL_REPORT.md
