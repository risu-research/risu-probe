name: "P6-B36 independent eight-upstream original source first look"
on:
  push:
    branches:
      - qualification/p6b36-independent-seal-20261113
    paths:
      - benchmarks/p6b36/**
      - .github/workflows/p6b36-sealed-first-look.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frozen-first-look:
    name: Original eight upstream repairs; frozen source detector; no foreign execution
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout B36 pre-sealed evaluator and manifest
        uses: actions/checkout@v5
        with:
          path: holdout
          persist-credentials: false
      - name: Checkout B34-trained algorithm before B36 source inspection
        uses: actions/checkout@v5
        with:
          repository: risu-research/risu-probe
          ref: c34def4a25b66cbc89df039ca235d6c1df2094f0
          path: development
          persist-credentials: false
      - name: Checkout immutable original public product
        uses: actions/checkout@v5
        with:
          repository: risu-research/risu-probe
          ref: 8d622b792b4ae58b7157fd81ee5f95d6febcfd53
          path: frozen
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Checkout B36A genuine before fix-side Git parent
        uses: actions/checkout@v5
        with:
          repository: agentarea/agentarea
          ref: 0ccc32d1438f58b11619e2dd83e3518bda338198
          path: holdout/upstream/B36A/before
          persist-credentials: false
          submodules: false
          fetch-depth: 1
          sparse-checkout: |
            agentarea-platform/libs/execution/agentarea_execution/workflows/helpers.py
          sparse-checkout-cone-mode: false
      - name: Checkout B36A genuine after fix-side Git parent
        uses: actions/checkout@v5
        with:
          repository: agentarea/agentarea
          ref: 43af5b172b5255e6c61d253fd456b4d59797d225
          path: holdout/upstream/B36A/after
          persist-credentials: false
          submodules: false
          fetch-depth: 1
          sparse-checkout: |
            agentarea-platform/libs/execution/agentarea_execution/workflows/helpers.py
          sparse-checkout-cone-mode: false
      - name: Checkout B36B genuine before fix-side Git parent
        uses: actions/checkout@v5
